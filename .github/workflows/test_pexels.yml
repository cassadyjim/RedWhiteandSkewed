name: Test Pexels API

on:
  workflow_dispatch:

jobs:
  test-pexels:
    runs-on: ubuntu-latest
    steps:
      - name: Test Pexels API Key
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python3 << 'PYEOF'
          import os, json
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError

          key = os.environ.get("PEXELS_API_KEY", "")
          print("Key present:", bool(key))
          print("Key length:", len(key))
          if key:
              print("Key last 5:", key[-5:])
              print("Key has newline:", "\n" in key or "\r" in key)
          else:
              print("ERROR: PEXELS_API_KEY is empty or not set")
              exit(1)

          url = "https://api.pexels.com/v1/search?query=politics&per_page=1"
          req = Request(url, headers={"Authorization": key})
          try:
              with urlopen(req, timeout=15) as r:
                  data = json.loads(r.read())
                  photos = data.get("photos", [])
                  print("SUCCESS - photos returned:", len(photos))
                  if photos:
                      p = photos[0]
                      print("Photo ID:", p.get("id"))
                      print("Photo URL:", p.get("src", {}).get("large", "N/A"))
          except HTTPError as e:
              print("HTTP Error:", e.code, e.reason)
              print("=> API key is invalid or expired. Regenerate at pexels.com/api")
              exit(1)
          except URLError as e:
              print("Network Error:", e.reason)
              print("=> GitHub runner cannot reach api.pexels.com")
              exit(1)
          except Exception as e:
              print("Unexpected error:", e)
              exit(1)
          PYEOF
