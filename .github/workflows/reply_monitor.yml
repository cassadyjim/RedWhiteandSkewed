name: RWS Reply Monitor

# Checks for your email reply every 30 minutes, all day
# Exits instantly if no pending story exists (very low resource usage)
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub UI

permissions:
  contents: write  # Needed to commit updated state/story files back to repo

jobs:
  check-reply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # Uses built-in GITHUB_TOKEN — auto-generated per run, never expires
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic requests paramiko

      - name: Check for email reply
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          SMTP_HOST: send.one.com
          SMTP_PORT: "465"
          SMTP_FROM: info@redwhiteandskewed.com
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          IMAP_HOST: imap.one.com
          IMAP_PORT: "993"
          IMAP_USER: info@redwhiteandskewed.com
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          RWS_SFTP_HOST: ${{ secrets.RWS_SFTP_HOST }}
          RWS_SFTP_USERNAME: ${{ secrets.RWS_SFTP_USERNAME }}
          RWS_SFTP_PASSWORD: ${{ secrets.RWS_SFTP_PASSWORD }}
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: ${{ secrets.WIX_SITE_ID }}
          WIX_COLLECTION_ID: ${{ secrets.WIX_COLLECTION_ID }}
        run: python3 rws_reply_monitor.py

      - name: Commit any changes back to repo
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "RWS Bot"
          # Use GITHUB_TOKEN for push — always valid, no custom secret needed
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          # Stage story-related files
          git add state/ story_history.json index.json latest.json 2>/dev/null || true
          git add 2026-*.json 2>/dev/null || true
          # Stash unstaged changes so rebase can proceed cleanly
          git stash --include-untracked 2>/dev/null || true
          git pull --rebase origin main
          git stash pop 2>/dev/null || true
          # Commit if there are staged changes
          git diff --staged --quiet || git commit -m "chore: reply processed $(date +%Y-%m-%dT%H:%M)"
          git push

      - name: Send failure notification email
        if: failure()
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          python3 - <<'PYEOF'
          import smtplib, ssl, os, datetime
          password = os.environ.get("SMTP_PASSWORD", "")
          if not password:
              print("No SMTP_PASSWORD — skipping failure email")
              exit(0)
          now = datetime.datetime.utcnow().strftime("%Y-%m-%d %H:%M UTC")
          body = f"From: info@redwhiteandskewed.com\r\nTo: jim@redwhiteandskewed.com\r\nSubject: RWS Reply Monitor FAILED - {now}\r\nContent-Type: text/plain\r\n\r\nThe RWS Reply Monitor GitHub Actions workflow failed at {now}.\r\n\r\nCheck logs: https://github.com/cassadyjim/RedWhiteandSkewed/actions/workflows/reply_monitor.yml\r\n\r\nCommon causes:\r\n- SMTP_PASSWORD or IMAP_PASSWORD secret expired\r\n- ANTHROPIC_API_KEY secret expired\r\n- Network error during story generation\r\n\r\n-- RWS Automation\r\n"
          ctx = ssl.create_default_context()
          with smtplib.SMTP_SSL("send.one.com", 465, context=ctx) as s:
              s.login("info@redwhiteandskewed.com", password)
              s.sendmail("info@redwhiteandskewed.com", "jim@redwhiteandskewed.com", body.encode())
          print("Failure notification sent to jim@redwhiteandskewed.com")
          PYEOF
